<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>PlugWarden</title>
  <link rel="icon" href="/static/img/mark.svg" type="image/svg+xml">
  <link rel="preload" href="/static/fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/app.css">
  <script>
    (function () {
      var t = new URLSearchParams(location.search).get("theme");
      if (!t) try { t = localStorage.getItem("amp.theme"); } catch (e) {}
      if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  <script type="importmap">
    { "imports": {
      "preact": "/static/vendor/preact.module.js",
      "preact/hooks": "/static/vendor/hooks.module.js",
      "htm": "/static/vendor/htm.module.js"
    } }
  </script>
  <script type="module" src="/static/js/main.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="app"></div>
  <noscript><p style="padding:24px">PlugWarden needs JavaScript enabled.</p></noscript>
</body>
</html>
